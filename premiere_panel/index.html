<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Roteiro IA</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #1e1e1e; color: #e6e6e6; font-family: "Segoe UI", sans-serif; font-size: 13px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { color: #9a9a9a; font-size: 12px; }
  button { font-family: inherit; font-size: 13px; border-radius: 8px; border: 1px solid #444; background: #2b2b2b; color: #e6e6e6; padding: 8px 12px; cursor: pointer; }
  button:hover { background: #343434; }
  button.primario { background: #d9774a; border-color: #d9774a; color: #fff; font-weight: 600; padding: 10px 12px; }
  button.primario:hover { background: #e4855a; }
  button:disabled { opacity: .5; cursor: default; }
  .job { background: #262626; border-radius: 8px; padding: 8px 10px; word-break: break-all; font-size: 12px; color: #cfcfcf; }
  #log { flex: 1; min-height: 80px; overflow-y: auto; background: #181818; border-radius: 8px; padding: 8px 10px; }
  .linha { margin: 0 0 4px; white-space: pre-wrap; word-break: break-word; }
  .ok { color: #7fd18b; } .erro { color: #ff7b72; } .info { color: #e6e6e6; }
  #arquivo { display: none; }
</style>
</head>
<body>
  <h1>Roteiro IA</h1>
  <div class="sub">Monta o projeto do Premiere a partir do job gerado.</div>
  <div class="job" id="jobCaminho"></div>
  <button id="btnEscolher">Escolher job</button>
  <input type="file" id="arquivo" accept=".json">
  <button id="btnMontar" class="primario">Montar projeto</button>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
