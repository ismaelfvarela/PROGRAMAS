[project]
name = "roteiro-ia"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic",
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "faster-whisper",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cudnn-cu12==9.1.0.70",
  "scenedetect",
  "opencv-python",
  "beat_this",
  "torch",
  "torchaudio==2.5.1",
  "google-genai",
  "keyring",
  "jinja2",
  "PySide6",
  "tzdata>=2026.6",
]

[project.scripts]
roteiro-ia = "roteiro_ia.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roteiro_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gemini: teste real contra a API Gemini (requer chave)",
  "windows: teste que usa o Microsoft Edge instalado no Windows",
  "integracao: evento sintético completo (ffmpeg, Edge, Gemini/Whisper falsos)",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

