[project]
name = "roteiro-ia"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic",
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "faster-whisper",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cudnn-cu12==9.1.0.70",
  "scenedetect",
  "opencv-python",
  "beat_this",
  "torch",
  "torchaudio==2.5.1",
  "google-genai",
  "keyring",
  "jinja2",
  "PySide6",
  "tzdata>=2026.6",
  "demucs>=4.0.1",
  "transformers>=4.50,<5",
]

[project.scripts]
roteiro-ia = "roteiro_ia.cli:main"
roteiro-ia-janela = "roteiro_ia.ui.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roteiro_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gemini and not modelos'"  # API real só com -m gemini (gasta cota); modelos locais reais só com -m modelos
markers = [
  "gemini: teste real contra a API Gemini (requer chave)",
  "modelos: teste real com Demucs e CLAP (baixa os modelos na primeira vez; GPU se houver)",
  "windows: teste que usa o Microsoft Edge instalado no Windows",
  "integracao: evento sintético completo (ffmpeg, Edge, Gemini/Whisper falsos)",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

